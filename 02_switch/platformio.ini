[platformio]
; ESP-IDF requires a build directory without spaces.
build_dir = ${platformio.core_dir}/build/${PROJECT_HASH}
default_envs = esp32dev, native_tests

[env:esp32dev]
platform = espressif32@6.4.0
; On-board tests require an explicit suite filter.
test_filter = board/*
board = esp32dev
framework = espidf
check_skip_packages = yes
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions.csv

[env:native_tests]
platform = native
test_framework = unity
; Also build the PC test executable when running plain pio run.
build_src_filter = +<../test/test_switch_pins/test_main.c>
build_flags = -Itest
lib_deps = throwtheswitch/Unity@^2.6.1
check_src_filters = +<test/>
