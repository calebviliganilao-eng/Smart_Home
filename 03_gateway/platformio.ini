[platformio]
; ESP-IDF requires a build directory without spaces.
build_dir = ${platformio.core_dir}/build/${PROJECT_HASH}
default_envs = esp32s3_n16r8, native_tests

[esp_firmware]
platform = espressif32@6.4.0
; On-board tests require an explicit suite filter.
test_filter = board/*
framework = espidf
check_skip_packages = yes
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions.csv

[env:esp32dev]
extends = esp_firmware
board = esp32dev

[env:esp32s3_n16r8]
extends = esp_firmware
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
monitor_dtr = 0
monitor_rts = 0

[env:native_tests]
platform = native
test_framework = unity
; Also build the PC test executable when running plain pio run.
build_src_filter = +<../test/test_gateway_page/test_main.c>
build_flags = -Itest
lib_deps = throwtheswitch/Unity@^2.6.1
check_src_filters = +<test/>
